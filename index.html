
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>celnu.com is for sale</title>
    <meta
      name="description"
      content="celnu.com is available for purchase. Asking price: $2,499. Call 828 553 7927 for offers and interest."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09100f;
        --ink: #f7f3e8;
        --muted: #b8c0ba;
        --line: rgba(247, 243, 232, 0.18);
        --accent: #6ee7c8;
        --accent-2: #f5c15d;
        --panel: rgba(255, 255, 255, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 18%, rgba(110, 231, 200, 0.18), transparent 28rem),
          radial-gradient(circle at 82% 70%, rgba(245, 193, 93, 0.14), transparent 26rem),
          linear-gradient(145deg, #08100f 0%, #111713 52%, #070908 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 960px);
        min-height: min(720px, calc(100vh - 48px));
        display: grid;
        align-content: center;
        gap: 44px;
        position: relative;
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid var(--line);
        border-radius: 28px;
        pointer-events: none;
      }

      .content {
        padding: clamp(28px, 8vw, 86px);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 26px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .tag::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 28px var(--accent);
      }

      h1 {
        max-width: 850px;
        margin: 0;
        font-size: clamp(3.5rem, 13vw, 9rem);
        line-height: 0.86;
        letter-spacing: 0;
      }

      .summary {
        max-width: 610px;
        margin: 30px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.55;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 42px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 58px;
        padding: 14px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        color: var(--ink);
        font-size: 1rem;
        font-weight: 800;
        text-decoration: none;
      }

      .pill strong {
        color: var(--accent-2);
        font-size: 1.15em;
      }

      .phone {
        background: var(--ink);
        color: var(--bg);
        border-color: transparent;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .phone:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 60px rgba(247, 243, 232, 0.16);
      }

      footer {
        padding: 0 clamp(28px, 8vw, 86px) clamp(28px, 7vw, 70px);
        color: rgba(247, 243, 232, 0.55);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        main {
          min-height: calc(100vh - 28px);
        }

        main::before {
          border-radius: 22px;
        }

        h1 {
          font-size: clamp(3.2rem, 22vw, 5.8rem);
        }

        .details {
          display: grid;
        }

        .pill {
          justify-content: center;
          width: 100%;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="domain-name">
      <section class="content">
        <p class="tag">Premium domain available</p>
        <h1 id="domain-name">celnu.com</h1>
        <p class="summary">
          A short, clean, brandable domain name is ready for its next project.
          Direct purchase inquiries and serious offers are welcome.
        </p>
        <div class="details" aria-label="Sale details">
          <div class="pill">Asking price&nbsp;<strong>$2,499</strong></div>
          <a class="pill phone" href="tel:+18285537927">Call 828 553 7927</a>
        </div>
      </section>
      <footer>For offers and interest, please call the number above.</footer>
    </main>
  </body>
</html>
